name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Chromium for the prerender step (scripts/prerender.js). npm ci downloads
      # it on a cache miss; this keeps subsequent runs fast.
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: puppeteer-${{ runner.os }}-
      # Prerendered top-level pages. scripts/prerender.js validates this against
      # a hash of the built bundle, so a flash-only edit (which never touches the
      # bundle) reuses it and skips launching a browser entirely.
      - name: Cache prerendered pages
        uses: actions/cache@v4
        with:
          path: .cache/prerender
          key: prerender-${{ hashFiles('src/**', 'index.html', 'scripts/prerender.js', 'package-lock.json') }}
          restore-keys: prerender-
      # Processed flash images (watermark + thumbnail). restore-keys lets a
      # flash edit start from the previous set so generateFlashesIndex.js only
      # re-runs sharp on the images that actually changed.
      - name: Cache processed flash images
        uses: actions/cache@v4
        with:
          path: |
            public/flashes_processed
            .cache/flashes
          key: flash-images-${{ hashFiles('public/flashes/**/*.png', 'public/flashes/**/*.jpg', 'public/flashes/**/*.jpeg') }}
          restore-keys: flash-images-
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
